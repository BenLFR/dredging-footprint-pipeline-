name: Quality Gate (tests + benchmark + smoke)

on:
  push:
    branches: [pub/v1.0-clean, main]
  pull_request:
    branches: [pub/v1.0-clean, main]

jobs:
  smoke-test:
    name: Pipeline smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run editorial hygiene checks (Phase 1 scope)
        run: python tests/editorial_hygiene_check.py --strict --include README.md CONTRIBUTING.md docs/*.md documentation/*.md deploy/*.sh config/templates/slurm/*.sh

      - name: Run deploy sanitation checks
        run: python tests/deploy_sanitation_check.py --strict

      - name: Run deploy shell syntax checks
        shell: bash
        run: |
          shopt -s nullglob
          bash -n deploy/*.sh
          bash -n config/templates/slurm/submit_step.sh
          bash -n pipeline/*.sh pipeline/step5/*.sh

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-441-${{ hashFiles('renv.lock') }}
          restore-keys: r-441-

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "data.table", "arrow", "qs", "mclust", "dbscan",
            "sf", "terra", "yaml", "dplyr", "testthat",
            "lubridate", "solitude", "zoo"
          )
          missing <- pkgs[!pkgs %in% installed.packages()[,"Package"]]
          if (length(missing) > 0) {
            install.packages(missing, repos = "https://cloud.r-project.org",
                             quiet = TRUE)
          }
          cat("All packages installed\n")

      - name: Run testthat suite
        run: Rscript tests/run_testthat.R

      - name: Run benchmark regression guard
        run: Rscript tests/benchmark_regression_guard.R

      - name: Validate HPC template path
        run: Rscript tests/hpc_template_path_check.R

      - name: Run smoke test (steps 2-5, toy data)
        run: Rscript tests/smoke_test_steps2_5.R

      - name: Run end-to-end step2 canonical test
        run: Rscript tests/e2e_step2_canonical.R

      - name: Upload toy data artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-debug
          path: data/toy/
          retention-days: 3
