name: Smoke Test (steps 2-5, toy data)

on:
  push:
    branches: [pub/v1.0-clean, main]
  pull_request:
    branches: [pub/v1.0-clean, main]

jobs:
  smoke-test:
    name: Pipeline smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-441-${{ hashFiles('renv.lock') }}
          restore-keys: r-441-

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "data.table", "arrow", "qs", "mclust", "dbscan",
            "sf", "terra", "yaml", "dplyr"
          )
          missing <- pkgs[!pkgs %in% installed.packages()[,"Package"]]
          if (length(missing) > 0) {
            install.packages(missing, repos = "https://cloud.r-project.org",
                             quiet = TRUE)
          }
          cat("All packages installed\n")

      - name: Run smoke test
        run: |
          chmod +x tests/smoke_test_steps2_5.sh
          bash tests/smoke_test_steps2_5.sh

      - name: Upload toy data artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-debug
          path: data/toy/
          retention-days: 3
