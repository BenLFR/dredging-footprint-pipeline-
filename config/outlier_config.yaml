# ===============================================================================
# CONFIGURATION SYSTÈME DE DÉTECTION D'OUTLIERS V6
# Fichier de paramètres pour ajustement métier sans modification du code R
# ===============================================================================

# Seuils techniques adaptatifs par navire
technique:
  speed_margin_pct: 0.15          # 15% marge sur sailing_speed_knots
  default_max_speed: 25           # Vitesse max par défaut si specs manquantes (kn)
  missing_specs_threshold: 0.10   # Seuil d'alerte si >10% specs manquantes

# Isolation Forest multivariée
isolation_forest:
  contamination_rate: 0.03        # Réduit de 5% à 3% pour économiser mémoire
  sample_size: 512                # Réduit de 1000 à 512 pour économiser mémoire
  num_trees: 50                   # Réduit de 100 à 50 arbres
  min_points_per_vessel: 100      # Minimum de points pour appliquer IF par navire
  max_depth: 8                    # Limite profondeur pour économiser mémoire

# Détection pics temporels isolés
temporal_spikes:
  spike_factor: 5.0                # 5x MAD pour détection pics temporels (thesis §2.2)
  min_duration: 2                 # Durée min voisinage pour éviter faux positifs
  rolling_window: 5               # Taille fenêtre rolling pour médiane/MAD

# Percentiles robustes contextuels
contextual:
  percentile_lower: 0.01           # 1er percentile pour valeurs basses extrêmes
  percentile_upper: 0.99           # 99e percentile pour valeurs hautes extrêmes
  min_context_points: 20          # Min points pour percentiles stables → fallback IQR
  
  # Seuils classification contexte opérationnel (kn)
  context_thresholds:
    stop_threshold: 1.0           # Speed < 1kn = arrêt/mouillage
    dredging_threshold: 4.0       # Speed < 4kn = opération dragage
    maneuver_threshold: 8.0       # Speed < 8kn = manœuvre lente
    # Speed >= 8kn = transit rapide

# Validation physique maritime
physics:
  max_acceleration_ms2: 2.0       # Accélération max réaliste gros navires (m/s²)
  max_turn_at_speed: 120          # Angle max virage si Speed > 5kn (degrés)
  max_dredging_speed: 6.0         # Vitesse max cohérente avec dragage (kn)
  min_speed_for_turn_check: 5.0   # Vitesse min pour vérifier virages brutaux (kn)

# Performance et optimisation
performance:
  parallel_threshold: 1000000     # Nb points pour activer parallélisme
  memory_cleanup: true            # Purge objets IF après utilisation
  enable_logging: true            # Sauvegarde outliers pour audit
  verbose_diagnostics: true       # Affichage détaillé du nettoyage

# Paramètres avancés (experts seulement)
advanced:
  # Contamination adaptative pour petits échantillons
  adaptive_contamination: true
  min_sample_size: 500          # Taille min pour contamination normale
  
  # Fallback IQR pour contextes avec peu de données
  iqr_fallback:
    multiplier: 1.5               # Multiplicateur IQR standard
    enabled: true
    
  # Conversion physique
  ms2_to_knots_factor: 1.943844   # Facteur conversion m/s² → kn/s

# Validation et audit
audit:
  save_removed_outliers: true     # Sauvegarder outliers supprimés (CSV détaillés)
  consolidate_logs: true          # Créer fichier audit consolidé
  save_config_copy: true          # Sauver config utilisée pour traçabilité
  summary_statistics: true        # Générer résumé statistiques nettoyage
  write_outlier_csv: true         # Flag I/O : false sur gros jobs (>100M lignes)

# ===============================================================================
# NOTES POUR L'ÉQUIPE MÉTIER :
#
# 1. TECHNIQUE : Ajustez speed_margin_pct si les navires rapides perdent trop
#    de données légitimes (augmenter) ou si trop d'outliers passent (diminuer)
#
# 2. ISOLATION FOREST : contamination_rate plus élevé = plus permissif
#    Valeurs recommandées : 0.03-0.07 selon la qualité des capteurs
#
# 3. PICS TEMPORELS : spike_factor plus bas = plus strict (2-4 recommandé)
#    Diminuer si trop d'erreurs capteur passent, augmenter si manœuvres perdues
#
# 4. CONTEXTUELS : percentiles très larges par défaut (0.1%-99.9%)
#    Resserrer vers 1%-99% si nécessaire pour être plus strict
#
# 5. PHYSIQUE : max_turn_at_speed dépend du type de navire
#    TSHD standard: 120°, navires plus agiles: jusqu'à 140°
# ===============================================================================

# ==============================================================================
# CONFIGURATION OPTIMISÉE OUTLIERS V6 - BELUGA HPC
# ==============================================================================

# Gestion données manquantes
missing_specs_threshold: 0.5     # 50% minimum de spécifications techniques
min_segment_size: 50            # Taille minimum segment pour analyse

# Paramètres parallélisation (OPTIMISÉ MÉMOIRE)
parallel_chunk_size: 5000       # Chunks plus petits pour économiser mémoire
max_parallel_navires: 4         # Maximum 4 navires en parallèle
gc_frequency: 100               # Garbage collection tous les 100 segments

# Configuration avancée
robust_outlier_detection: true   # Méthodes robustes pour petits échantillons
memory_conservative: true        # Mode conservateur mémoire activé 

