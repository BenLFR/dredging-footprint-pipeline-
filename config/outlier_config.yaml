# ===============================================================================
# OUTLIER DETECTION CONFIGURATION V6
# Parameter file for tuning without modifying R code
# ===============================================================================

# Adaptive technical thresholds per vessel
technique:
  speed_margin_pct: 0.15          # 15% margin on sailing_speed_knots
  default_max_speed: 25           # Default max speed if specs missing (kn)
  missing_specs_threshold: 0.10   # Alert threshold if >10% specs missing

# Multivariate Isolation Forest
isolation_forest:
  contamination_rate: 0.03        # Reduced from 5% to 3% to save memory
  sample_size: 512                # Reduced from 1000 to 512 to save memory
  num_trees: 50                   # Reduced from 100 to 50 trees
  min_points_per_vessel: 100      # Minimum points to apply IF per vessel
  max_depth: 8                    # Max tree depth to save memory

# Isolated temporal spike detection
temporal_spikes:
  spike_factor: 5.0                # 5x MAD for temporal spike detection (thesis §2.2)
  min_duration: 2                 # Min neighbourhood duration to avoid false positives
  rolling_window: 5               # Rolling window size for median/MAD

# Robust contextual percentiles
contextual:
  percentile_lower: 0.01           # 1st percentile for extreme low values
  percentile_upper: 0.99           # 99th percentile for extreme high values
  min_context_points: 20          # Min points for stable percentiles → fallback IQR

  # Operational context classification thresholds (kn)
  context_thresholds:
    stop_threshold: 1.0           # Speed < 1kn = stopped/anchored
    dredging_threshold: 4.0       # Speed < 4kn = dredging operation
    maneuver_threshold: 8.0       # Speed < 8kn = slow manoeuvre
    # Speed >= 8kn = fast transit

# Maritime physics validation
physics:
  max_acceleration_ms2: 2.0       # Realistic max acceleration for large vessels (m/s²)
  max_turn_at_speed: 120          # Max turn angle if Speed > 5kn (degrees)
  max_dredging_speed: 6.0         # Max speed consistent with dredging (kn)
  min_speed_for_turn_check: 5.0   # Min speed to check abrupt turns (kn)

# Performance and optimisation
performance:
  parallel_threshold: 1000000     # Point count threshold to enable parallelism
  memory_cleanup: true            # Purge IF objects after use
  enable_logging: true            # Save outliers for audit
  verbose_diagnostics: true       # Detailed cleanup output

# Advanced parameters (experts only)
advanced:
  # Adaptive contamination for small samples
  adaptive_contamination: true
  min_sample_size: 500          # Min size for normal contamination

  # IQR fallback for low-data contexts
  iqr_fallback:
    multiplier: 1.5               # Standard IQR multiplier
    enabled: true

  # Physical conversion
  ms2_to_knots_factor: 1.943844   # m/s² → kn/s conversion factor

# Validation and audit
audit:
  save_removed_outliers: true     # Save removed outliers (detailed CSVs)
  consolidate_logs: true          # Create consolidated audit file
  save_config_copy: true          # Save config used for traceability
  summary_statistics: true        # Generate cleanup statistics summary
  write_outlier_csv: true         # I/O flag: false on large jobs (>100M rows)

# ===============================================================================
# TUNING NOTES:
#
# 1. TECHNIQUE: Adjust speed_margin_pct if fast vessels lose too many legitimate
#    data points (increase) or if too many outliers pass through (decrease)
#
# 2. ISOLATION FOREST: higher contamination_rate = more permissive
#    Recommended values: 0.03-0.07 depending on sensor quality
#
# 3. TEMPORAL SPIKES: lower spike_factor = stricter (2-4 recommended)
#    Decrease if sensor errors slip through; increase if manoeuvres are lost
#
# 4. CONTEXTUAL: percentiles are very wide by default (0.1%-99.9%)
#    Tighten towards 1%-99% if stricter filtering is needed
#
# 5. PHYSICS: max_turn_at_speed depends on vessel type
#    Standard TSHD: 120°, more agile vessels: up to 140°
# ===============================================================================

# ==============================================================================
# OPTIMISED OUTLIER CONFIG V6 - BELUGA HPC
# ==============================================================================

# Missing data handling
missing_specs_threshold: 0.5     # Minimum 50% of technical specifications
min_segment_size: 50            # Minimum segment size for analysis

# Parallelisation parameters (MEMORY-OPTIMISED)
parallel_chunk_size: 5000       # Smaller chunks to save memory
max_parallel_navires: 4         # Maximum 4 vessels in parallel
gc_frequency: 100               # Garbage collection every 100 segments

# Advanced configuration
robust_outlier_detection: true   # Robust methods for small samples
memory_conservative: true        # Conservative memory mode enabled

